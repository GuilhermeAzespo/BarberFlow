# ─────────────────────────────────────────────────────────────
# BarberFlow — Stack completa (PostgreSQL + API + Web)
#
# Easypanel: crie um serviço do tipo "Compose" apontando para este
# repositório. Os serviços usam `expose` (sem bind de portas no host)
# para não conflitar com o proxy do Easypanel. Configure o domínio
# público apenas no serviço `web` (porta 3000). A API é acessada pelo
# Next.js via rede interna (proxy em /api/*), então não precisa de domínio.
#
# Local: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
# ─────────────────────────────────────────────────────────────

name: barberflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-barberflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-barberflow}
      TZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  server:
    build:
      context: ./apps/server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-barberflow}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-barberflow}?schema=public
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRIAL_DAYS: ${TRIAL_DAYS:-14}
      BILLING_GRACE_DAYS: ${BILLING_GRACE_DAYS:-5}
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      SUPER_ADMIN_NAME: ${SUPER_ADMIN_NAME:-Super Admin}
      SUPER_ADMIN_EMAIL: ${SUPER_ADMIN_EMAIL:?Defina SUPER_ADMIN_EMAIL}
      SUPER_ADMIN_PASSWORD: ${SUPER_ADMIN_PASSWORD:?Defina SUPER_ADMIN_PASSWORD}
    expose:
      - "4000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 5

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_INTERNAL_URL: http://server:4000
    expose:
      - "3000"

volumes:
  pgdata:
